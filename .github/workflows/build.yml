name: Build

# Проверочная сборка для веток (кроме main): без релиза, просто «компилируется ли»
on:
  push:
    branches-ignore: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build DynamicIsland.csproj -c Release --nologo
      - run: dotnet build Settings/DynamicIsland.Settings.csproj -c Release --nologo
      - run: dotnet build NetHelper/DynamicIsland.NetHelper.csproj -c Release --nologo
